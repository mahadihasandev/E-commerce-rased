name: Render Frontend & Backend Keep Alive Ping

on:
  schedule:
    # Runs every 13 minutes to prevent Render free tier from spinning down (15 min idle timeout)
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Services
        run: |
          echo "=========================================="
          echo "Pinging Render Services ($(date))"
          echo "=========================================="
          
          # Ping Backend Health
          echo "Pinging Backend..."
          STATUS_B=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://php-ecommerce-backend-rased.onrender.com/api/health" || echo "FAIL")
          echo "Backend Status: $STATUS_B"
          
          # Ping Frontend Health
          echo "Pinging Frontend..."
          STATUS_F=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://e-commerce-rased.onrender.com/api/health" || echo "FAIL")
          echo "Frontend Status: $STATUS_F"
          
          echo "Keep-alive ping completed."
